name: Build and deploy to cPanel

# Every push to main is checked, built and (if deploy secrets are set) uploaded
# to cPanel. You can also run it by hand from the Actions tab.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint and type-check
        run: |
          npm run lint
          npm run typecheck

      - name: Build cPanel bundle
        run: npm run package:cpanel

      - name: Keep the bundle as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: techbucket-site
          path: deploy/techbucket-site.zip
          retention-days: 14

      # ---- Deploy (only on main, only when FTP secrets are configured) ----
      - name: Check deploy settings
        id: cfg
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -n "$FTP_SERVER" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FTP secrets not set yet, so the site was built but not deployed. See DEPLOY-CPANEL.md, 'Automatic deploys from GitHub'."
          fi

      - name: Upload to cPanel over FTPS
        if: steps.cfg.outputs.deploy == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/techbucket-site/
          # Path of the Node.js app folder as seen by this FTP account, ending in "/"
          server-dir: ${{ secrets.FTP_APP_DIR }}
          # Never touch the server's own files
          exclude: |
            **/.git*
            **/.git*/**
            .env
            node_modules
            node_modules/**
